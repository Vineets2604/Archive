services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: otaku_archive
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/otaku_archive
      JWT_SECRET: change-me
      API_PORT: 4000
    depends_on: [db]
    ports: ["4000:4000"]
volumes:
  postgres_data:
